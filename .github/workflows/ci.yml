name: Viewora CI — Build, Security & Real PostgreSQL Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Real PostgreSQL 16 Migrations, Security, Backup & Browser E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: viewora_test
          POSTGRES_USER: viewora_admin
          POSTGRES_PASSWORD: ci_ephemeral_admin_password_not_for_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viewora_admin -d viewora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3098
      AUTH_URL: http://localhost:3098
      AUTH_SECRET: ci-ephemeral-32-byte-secret-a1b2c3d4e5f60718293a4b5c6d7e8f90
      PAYMENTS_ENABLED: "false"
      NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
      DATABASE_ADMIN_URL: postgresql://viewora_admin:ci_ephemeral_admin_password_not_for_prod@127.0.0.1:5432/viewora_test?schema=public
      DATABASE_URL: postgresql://viewora_app:ci_ephemeral_app_password_not_for_prod@127.0.0.1:5432/viewora_test?schema=public
      TEST_DATABASE_URL: postgresql://viewora_admin:ci_ephemeral_admin_password_not_for_prod@127.0.0.1:5432/viewora_test?schema=public
      TEST_DATABASE_APP_URL: postgresql://viewora_app:ci_ephemeral_app_password_not_for_prod@127.0.0.1:5432/viewora_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PostgreSQL 16 client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Initialize restricted viewora_app role & disposable restore DB
        env:
          PGPASSWORD: ci_ephemeral_admin_password_not_for_prod
        run: |
          pg_isready -h 127.0.0.1 -p 5432 -U viewora_admin -d viewora_test
          psql -h 127.0.0.1 -U viewora_admin -d viewora_test -v ON_ERROR_STOP=1 <<'SQL'
            CREATE EXTENSION IF NOT EXISTS "pgcrypto";
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'viewora_app') THEN
                CREATE ROLE viewora_app
                  LOGIN
                  PASSWORD 'ci_ephemeral_app_password_not_for_prod'
                  NOSUPERUSER
                  NOCREATEDB
                  NOCREATEROLE
                  NOINHERIT
                  NOBYPASSRLS;
              END IF;
            END
            $$;
            GRANT CONNECT ON DATABASE viewora_test TO viewora_app;
            GRANT USAGE ON SCHEMA public TO viewora_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO viewora_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO viewora_app;
          SQL
          createdb -h 127.0.0.1 -U viewora_admin viewora_restore_check
          psql -h 127.0.0.1 -U viewora_admin -d viewora_restore_check -v ON_ERROR_STOP=1 <<'SQL'
            CREATE EXTENSION IF NOT EXISTS "pgcrypto";
            GRANT CONNECT ON DATABASE viewora_restore_check TO viewora_app;
            GRANT USAGE ON SCHEMA public TO viewora_app;
          SQL

      - name: Validate Prisma schema & generate Prisma Client
        run: |
          npx prisma validate
          npm run db:generate

      - name: Apply all three Prisma migrations (privileged admin role)
        run: npm run db:migrate:deploy

      - name: Seed reference data & verify idempotency (two consecutive runs)
        run: |
          npm run db:seed
          npm run db:seed

      - name: Verify database health under restricted viewora_app role
        run: npm run db:health

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & security tests
        run: npm run test

      - name: Run mandatory real PostgreSQL integration tests (viewora_test + viewora_app RLS)
        run: npm run test:db

      - name: Verify PostgreSQL backup, restore & schema/record/RLS parity
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: viewora_test
          POSTGRES_ADMIN_USER: viewora_admin
          POSTGRES_ADMIN_PASSWORD: ci_ephemeral_admin_password_not_for_prod
          BACKUP_DIR: /tmp/viewora-ci-backups
          SOURCE_DATABASE_URL: postgresql://viewora_admin:ci_ephemeral_admin_password_not_for_prod@127.0.0.1:5432/viewora_test?schema=public
          RESTORED_DATABASE_URL: postgresql://viewora_admin:ci_ephemeral_admin_password_not_for_prod@127.0.0.1:5432/viewora_restore_check?schema=public
          RESTORED_APP_URL: postgresql://viewora_app:ci_ephemeral_app_password_not_for_prod@127.0.0.1:5432/viewora_restore_check?schema=public
        run: |
          node scripts/db/verify-backup-restore.mjs seed-synthetic
          bash scripts/db/backup.sh
          DUMP_FILE=$(ls -t /tmp/viewora-ci-backups/viewora_*.dump | head -n 1)
          bash scripts/db/restore.sh "$DUMP_FILE" --target-db viewora_restore_check --confirm-restore
          PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql -h 127.0.0.1 -U viewora_admin -d viewora_restore_check -v ON_ERROR_STOP=1 <<'SQL'
            GRANT USAGE ON SCHEMA public TO viewora_app;
            GRANT USAGE ON SCHEMA app TO viewora_app;
            GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA app TO viewora_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO viewora_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO viewora_app;
          SQL
          node scripts/db/verify-backup-restore.mjs compare
          rm -rf /tmp/viewora-ci-backups

      - name: Run production Next.js build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Run PostgreSQL-connected production browser E2E & app restart persistence
        env:
          NODE_ENV: production
          SCREENSHOT_DIR: ./ci-screenshots
        run: |
          which google-chrome || which chromium || which chromium-browser
          node scripts/e2e-postgres.mjs

      - name: Upload synthetic CI browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-postgres-e2e-screenshots
          path: ci-screenshots/*.png
          retention-days: 7
          if-no-files-found: warn
